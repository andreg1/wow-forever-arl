# Posts every published release to the guild's Discord channel: the zip as an
# attachment, plus the title and notes (cut to Discord's 2,000 characters).
# The channel's webhook URL is the repo secret DISCORD_WEBHOOK
# (gh secret set DISCORD_WEBHOOK -R andreg1/wow-forever-arl).
# Run it by hand for an older release: Actions > Post release to Discord >
# Run workflow, with the tag (e.g. v0.6.1).
name: Post release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post (e.g. v0.6.1)
        required: true

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post the zip to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "::error::The DISCORD_WEBHOOK secret isn't set."
            exit 1
          fi
          mkdir -p dl
          gh release download "${TAG}" -R "${REPO}" -p "ARLExtensions-*.zip" -D dl
          zip="$(ls dl/*.zip | head -n 1)"
          gh release view "${TAG}" -R "${REPO}" --json name -q .name > title.txt
          gh release view "${TAG}" -R "${REPO}" --json body -q .body > notes.md
          python3 - "${TAG}" > payload.json <<'PY'
          import json, sys
          tag = sys.argv[1]
          title = open("title.txt", encoding="utf-8").read().strip() or tag
          body = open("notes.md", encoding="utf-8").read().strip()
          head = (f"**{title}** ({tag})\n"
                  "Extract the zip into `World of Warcraft\\_forever_\\Interface\\AddOns\\`, replacing the old folders.\n\n")
          room = 2000 - len(head) - 4
          if len(body) > room:
              body = body[:room].rsplit("\n", 1)[0] + "\n..."
          print(json.dumps({"content": head + body, "allowed_mentions": {"parse": []}}))
          PY
          curl --fail-with-body -sS \
            -F "payload_json=<payload.json" \
            -F "files[0]=@${zip}" \
            "${WEBHOOK}"
          echo
          echo "Posted ${zip} for ${TAG}."
